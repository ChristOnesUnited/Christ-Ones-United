<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment Successful — Christ One's United</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0f0e0c;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.card{background:#fff;border-radius:20px;padding:2.5rem 2rem;max-width:440px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.4);}
.icon{font-size:3.5rem;margin-bottom:1rem;}
.title{font-family:'Playfair Display',serif;font-size:1.75rem;color:#0f0e0c;margin-bottom:.5rem;}
.sub{font-size:.88rem;color:#7a7369;line-height:1.7;margin-bottom:1.5rem;}
.plan-chip{display:inline-block;background:#e0f0ea;color:#1a6b4a;font-size:.76rem;font-weight:600;padding:4px 14px;border-radius:20px;margin-bottom:1.5rem;}
.loading{display:flex;align-items:center;justify-content:center;gap:.75rem;padding:1.25rem;background:#f7f4ef;border-radius:12px;margin-bottom:1.5rem;}
.spinner{width:20px;height:20px;border:2px solid #ddd8ce;border-top-color:#1a6b4a;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:.84rem;color:#3a3836;font-weight:500;}
.btn{display:block;width:100%;padding:13px;background:#0f0e0c;color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;margin-bottom:.75rem;transition:background .2s;}
.btn:hover{background:#1a6b4a;}
.verse{font-size:.76rem;color:#bbb;font-style:italic;margin-top:1.5rem;line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <div class="title">You're In!</div>
  <p class="sub">Your Christ One's United membership is now active. May God bless your journey with us.</p>
  <div class="plan-chip" id="plan-label">✓ Active Member</div>
  <div class="loading" id="loading-section">
    <div class="spinner"></div>
    <div class="loading-text">Taking you into the app…</div>
  </div>
  <a class="btn" id="manual-btn" style="display:none;" href="/">Enter the App →</a>
  <div class="verse">"For where two or three gather in my name, there am I with them." — Matthew 18:20</div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var plan = params.get('plan') || 'monthly';
  var type = params.get('type') || 'individual';
  var name = params.get('name') ? decodeURIComponent(params.get('name')) : '';
  var email = params.get('email') ? decodeURIComponent(params.get('email')) : '';

  var planLabels = {
    individual_monthly: 'Individual · Monthly ($1.29/mo)',
    individual_annual:  'Individual · Annual ($9.99/yr)',
    business_monthly:   'Business · Monthly ($29.99/mo)',
    business_annual:    'Business · Annual ($239.99/yr)',
  };
  document.getElementById('plan-label').textContent = '✓ ' + (planLabels[plan] || 'Active Member');

  // Build redirect URL with all params for auto sign in
  var redirectUrl = '/?signin=true&type=' + encodeURIComponent(type);
  if(email) redirectUrl += '&email=' + encodeURIComponent(email);

  // Show manual button as fallback after 3 seconds
  setTimeout(function(){
    document.getElementById('manual-btn').style.display = 'block';
    document.getElementById('manual-btn').href = redirectUrl;
  }, 3000);

  // Auto redirect after 2 seconds
  setTimeout(function(){
    window.location.href = redirectUrl;
  }, 2000);
</script>
</body>
</html>
